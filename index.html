<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>На какой я серии?</title>
<meta name="description" content="Вспомни, на какой серии аниме ты остановился: пара вопросов по кадрам, и готово.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* Shape system: surfaces 16px, media 12px, interactive controls full pill. */
:root {
  --bg: #0e0f11; --surface: #16181b; --surface-2: #1e2125; --line: #2a2d33;
  --fg: #ededeb; --mut: #9097a0; --faint: #5c626b;
  --acc: #ff5d73; --acc-fg: #1c0b0f; --acc-soft: rgb(255 93 115 / .14);
  --shadow: 0 24px 60px rgb(0 0 0 / .45);
  --r: 16px; --r-media: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Onest", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
:root[data-theme="light"] {
  --bg: #f3f4f6; --surface: #fcfcfd; --surface-2: #eceef1; --line: #dcdfe4;
  --fg: #15171a; --mut: #59606a; --faint: #9aa0a8;
  --acc: #e03552; --acc-fg: #fff7f8; --acc-soft: rgb(224 53 82 / .1);
  --shadow: 0 24px 60px rgb(40 44 52 / .14);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4f6; --surface: #fcfcfd; --surface-2: #eceef1; --line: #dcdfe4;
    --fg: #15171a; --mut: #59606a; --faint: #9aa0a8;
    --acc: #e03552; --acc-fg: #fff7f8; --acc-soft: rgb(224 53 82 / .1);
    --shadow: 0 24px 60px rgb(40 44 52 / .14);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
::selection { background: var(--acc); color: var(--acc-fg); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: -.01em; }
.mut { color: var(--mut); }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top .wrap { display: flex; align-items: center; gap: 8px; height: 64px; }
.logo { font-weight: 700; font-size: 19px; letter-spacing: -.02em; text-decoration: none; margin-right: auto; display: flex; align-items: center; gap: 2px; }
.logo b { color: var(--acc); }
@media (max-width: 480px) { .top .btn span { display: none; } .top .btn.sm { width: 40px; padding: 0; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; transition: transform .15s var(--ease), background .2s, border-color .2s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn.primary { background: var(--acc); border-color: transparent; color: var(--acc-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mut); }
.btn.ghost:hover { color: var(--fg); background: var(--surface); }
.btn.sm { height: 38px; padding: 0 16px; font-size: 14px; }
.btn.icon { width: 40px; height: 40px; padding: 0; }
.btn i { font-size: 1.2em; }
kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .55; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

/* Home */
.hero { padding: 72px 0 32px; }
.hero h1 { font-size: clamp(40px, 7vw, 72px); line-height: 1; letter-spacing: -.045em; margin: 0 0 18px; font-weight: 700; }
.hero h1 b { color: var(--acc); font-weight: 700; }
.hero p { font-size: 18px; color: var(--mut); margin: 0 0 32px; max-width: 46ch; }
@media (max-width: 640px) { .hero { padding: 40px 0 24px; } .hero p { font-size: 16px; } }
.search { position: relative; max-width: 640px; }
.search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.search .field { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px 0 22px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
.search .field:focus-within { border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft); }
.search .field > i { font-size: 22px; color: var(--mut); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 18px; }
.search input::placeholder { color: var(--faint); }
.results { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; box-shadow: var(--shadow); }
.results:empty { display: none; }
.res { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 12px; cursor: pointer; text-decoration: none; }
.res[aria-selected="true"], .res:hover { background: var(--surface-2); }
.res img, .res .ph-img { width: 44px; height: 62px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
.res .t { font-weight: 600; line-height: 1.25; }
.res .s { font-size: 13px; color: var(--mut); margin-top: 2px; }
.res .n { font-size: 13px; color: var(--mut); text-align: right; }
.res-msg { padding: 14px 12px; color: var(--mut); font-size: 15px; }
.how { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 28px; color: var(--mut); font-size: 15px; }
.how span { display: inline-flex; align-items: center; gap: 8px; }
.how i { color: var(--acc); font-size: 18px; }

.section { padding-block: 40px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 40px; align-items: center; }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr; } .fan { display: none; } }
.fan { position: relative; height: 400px; }
.fan a { position: absolute; top: 50%; left: 50%; width: 190px; aspect-ratio: 2/3; border-radius: var(--r-media); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); transition: transform .5s var(--ease), box-shadow .3s; animation: fanIn .8s var(--ease) both; }
.fan a img { width: 100%; height: 100%; object-fit: cover; }
.fan a:nth-child(1) { transform: translate(-112%, -46%) rotate(-9deg); animation-delay: .05s; }
.fan a:nth-child(2) { transform: translate(-50%, -54%); z-index: 2; animation-delay: .15s; }
.fan a:nth-child(3) { transform: translate(12%, -46%) rotate(9deg); animation-delay: .25s; }
.fan a:hover { z-index: 3; box-shadow: 0 30px 70px rgb(0 0 0 / .55); }
.fan a:nth-child(1):hover { transform: translate(-116%, -52%) rotate(-11deg); }
.fan a:nth-child(2):hover { transform: translate(-50%, -60%); }
.fan a:nth-child(3):hover { transform: translate(16%, -52%) rotate(11deg); }
.fan a span { position: absolute; inset: auto 0 0 0; padding: 28px 12px 10px; font-size: 13px; font-weight: 600; color: #f2f2f0; background: linear-gradient(transparent, rgb(8 9 10 / .85)); opacity: 0; transition: opacity .25s; }
.fan a:hover span, .fan a:focus-visible span { opacity: 1; }
@keyframes fanIn { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 140px; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; scrollbar-width: thin; }
.rail a { scroll-snap-align: start; text-decoration: none; }
.rail .poster { aspect-ratio: 2/3; border-radius: var(--r-media); overflow: hidden; background: var(--surface-2); }
.rail .poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.rail a:hover .poster img { transform: scale(1.04); }
.rail .t { font-size: 14px; font-weight: 500; line-height: 1.3; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rail .s { font-size: 12px; color: var(--mut); }
.rail.skel-rail .poster { animation: shimmer 1.4s linear infinite; background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--surface-2) 70%, var(--fg) 6%) 50%, var(--surface-2) 70%); background-size: 300% 100%; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.section-head h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }

.resume { display: flex; align-items: center; gap: 16px; padding: 14px 14px 14px 14px; border-radius: var(--r); background: var(--acc-soft); border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent); margin-top: 28px; max-width: 640px; }
.resume img { width: 40px; height: 56px; border-radius: 8px; object-fit: cover; }
.resume div { flex: 1; min-width: 0; }
.resume b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Library grid */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 20px 16px; }
.card { position: relative; }
.card .poster { position: relative; aspect-ratio: 2/3; border-radius: var(--r-media); overflow: hidden; background: var(--surface-2); }
.card .poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.card:hover .poster img { transform: scale(1.03); }
.card .poster a { position: absolute; inset: 0; }
.card .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--acc); }
.card h3 { font-size: 15px; line-height: 1.3; margin: 10px 0 2px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { font-size: 13px; color: var(--mut); }
.card .ctrl { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.card .ctrl .btn { width: 34px; height: 34px; }
.card .ctrl .ep { flex: 1; text-align: center; font-size: 13px; }
.empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: var(--r); text-align: center; color: var(--mut); }
.empty i { font-size: 36px; color: var(--faint); display: block; margin-bottom: 8px; }

/* Title page */
.backdrop { position: absolute; inset: 0 0 auto 0; height: 520px; overflow: hidden; z-index: -1; pointer-events: none; }
.backdrop img { width: 100%; height: 100%; object-fit: cover; filter: blur(60px) saturate(1.3); opacity: .35; transform: scale(1.2); }
.backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, var(--bg) 92%); }
.title-head { display: grid; grid-template-columns: 220px 1fr; gap: 36px; padding: 40px 0 8px; align-items: start; }
.title-head .poster { border-radius: var(--r-media); overflow: hidden; aspect-ratio: 2/3; background: var(--surface-2); box-shadow: var(--shadow); }
.title-head .poster img { width: 100%; height: 100%; object-fit: cover; }
.title-head h1 { font-size: clamp(30px, 4.6vw, 48px); line-height: 1.05; letter-spacing: -.035em; margin: 4px 0 8px; }
.title-head .desc-wrap { grid-column: 2; }
.title-head .orig { color: var(--mut); margin: 0 0 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--mut); margin-bottom: 16px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts i { font-size: 16px; }
.desc { color: color-mix(in srgb, var(--fg) 82%, var(--bg)); max-width: 62ch; margin: 0; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--acc); cursor: pointer; font-size: 14px; margin-top: 6px; }
@media (max-width: 720px) {
  .title-head { grid-template-columns: 112px 1fr; gap: 18px; padding-top: 24px; }
  .title-head .desc-wrap { grid-column: 1 / -1; }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
@media (max-width: 640px) { .panel { padding: 18px 16px; } }
.seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: 999px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; height: 36px; padding: 0 16px; border-radius: 999px; cursor: pointer; color: var(--mut); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .2); }
.entries { margin: 18px 0 0; display: grid; gap: 4px; }
.entry { display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; cursor: pointer; }
.entry:hover { background: var(--surface-2); }
.entry input { width: 18px; height: 18px; accent-color: var(--acc); margin: 0; cursor: pointer; }
.entry img, .entry .ph-img { width: 34px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
.entry .t { font-weight: 500; line-height: 1.3; font-size: 15px; }
.entry .s { font-size: 13px; color: var(--mut); }
.entry .n { font-size: 13px; color: var(--mut); }
.entry.cur .t::after { content: "этот"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--acc); background: var(--acc-soft); padding: 2px 8px; border-radius: 999px; vertical-align: 2px; }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; color: var(--mut); font-size: 14px; padding: 8px 10px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary i { transform: rotate(90deg); }
details.more summary i { transition: transform .2s; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
@media (max-width: 720px) { .opts { grid-template-columns: 1fr; } }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); cursor: pointer; }
.opt .tx b { display: block; font-weight: 500; font-size: 15px; }
.opt .tx span { font-size: 13px; color: var(--mut); }
.switch { position: relative; flex: none; width: 40px; height: 24px; margin-top: 1px; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); transition: transform .25s var(--ease); }
.switch input:checked + span { background: var(--acc); }
.switch input:checked + span::after { transform: translateX(16px); background: var(--acc-fg); }
.switch input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; }
.range-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--mut); margin-top: 14px; }
.range-in input { width: 84px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; text-align: center; font-family: var(--mono); }
.range-in input:focus { outline: none; border-color: var(--acc); }
.startbar { position: sticky; bottom: 0; padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); margin-top: 24px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.startbar .btn.primary { height: 54px; padding: 0 30px; font-size: 17px; }
@media (max-width: 640px) { .startbar { flex-direction: column-reverse; align-items: stretch; gap: 8px; } .startbar #summary { text-align: center; } }

/* Quiz */
.quiz { padding-block: 24px 40px; }
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14px; color: var(--mut); }
.qbar .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline { position: relative; height: 26px; margin-bottom: 22px; }
.timeline .segs { position: absolute; inset: 11px 0; display: flex; gap: 3px; }
.timeline .segs div { height: 4px; border-radius: 2px; background: var(--line); }
.timeline .known { position: absolute; top: 11px; left: 0; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--acc) 45%, transparent); transition: width .5s var(--ease); }
.timeline .win { position: absolute; top: 5px; height: 16px; border-radius: 6px; border: 1.5px solid var(--acc); transition: left .5s var(--ease), width .5s var(--ease); }
.timeline .mark { position: absolute; top: 0; width: 2px; height: 26px; margin-left: -1px; background: var(--fg); border-radius: 1px; transition: left .5s var(--ease); }
.qgrid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .qgrid { grid-template-columns: 1fr; gap: 18px; } }
.shot { position: relative; aspect-ratio: 16/9; border-radius: var(--r); overflow: hidden; background: var(--surface-2); touch-action: pan-y; user-select: none; box-shadow: var(--shadow); }
.shot img { width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
.shot img.contain { object-fit: contain; background: #0b0c0e; }
.shot .nodata { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--mut); gap: 6px; padding: 20px; font-size: 15px; }
.shot .nodata i { font-size: 34px; color: var(--faint); }
.shot .stamp { position: absolute; top: 16px; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .15s; pointer-events: none; }
.shot .stamp.y { right: 16px; background: var(--acc); color: var(--acc-fg); }
.shot .stamp.n { left: 16px; background: var(--fg); color: var(--bg); }
.skel { background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--surface-2) 70%, var(--fg) 6%) 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.skel-line { height: 14px; border-radius: 7px; margin: 10px 0; }
.qinfo .where { font-size: 14px; color: var(--mut); margin-bottom: 6px; }
.qinfo .where b { color: var(--acc); font-weight: 600; }
.qinfo h2 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.15; letter-spacing: -.025em; margin: 0 0 4px; }
.qinfo .alt { font-size: 14px; color: var(--mut); margin: 0 0 16px; }
.syn { position: relative; color: color-mix(in srgb, var(--fg) 85%, var(--bg)); font-size: 15px; margin: 0; }
.syn.hidden { cursor: pointer; }
.syn.hidden p { filter: blur(7px); user-select: none; }
.syn.hidden::after { content: "Описание скрыто от спойлеров. Нажми, чтобы показать"; position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 14px; font-weight: 500; color: var(--fg); padding: 0 12px; }
.syn p { margin: 0; transition: filter .3s; }
.syn.hidden + .syn-tools { display: none; }
.syn-tools { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
.answers .btn { height: 56px; font-size: 16px; }
.answers .wide { grid-column: 1 / -1; }
.answers-sub { display: flex; justify-content: space-between; margin-top: 6px; }
@media (max-width: 860px) {
  .qinfo { display: flex; flex-direction: column; }
  .answers { position: sticky; bottom: 0; z-index: 5; order: 3; margin: 16px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .answers .btn { height: 52px; }
  .answers-sub { order: 4; }
  .shot { box-shadow: none; }
}
.slide-in { animation: slideIn .45s var(--ease) both; }
.slide-in.from-l { animation-name: slideInL; }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideInL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

/* Result */
.result { padding-block: 40px 48px; }
.result .lead { font-size: 15px; color: var(--mut); margin: 0 0 6px; }
.result h1 { font-size: clamp(34px, 5.4vw, 56px); line-height: 1.04; letter-spacing: -.04em; margin: 0 0 8px; }
.result h1 b { color: var(--acc); }
.result .sub { color: var(--mut); margin: 0 0 32px; max-width: 60ch; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
.epcard { border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.epcard.next { border-color: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.epcard .img { aspect-ratio: 16/9; background: var(--surface-2); }

const LANGS = { ru: 'RU', en: 'EN' };

const detectLang = () => /^(ru|uk|be|kk)\b/.test((navigator.languages?.[0] || navigator.language || 'en').toLowerCase()) ? 'ru' : 'en';
let lang = LANGS[store.get('lang')] ? store.get('lang') : detectLang();
const missingT = new Set();
function t(s, v) {
  let r = s;
  if (lang === 'en') { r = EN[s]; if (r == null) { missingT.add(s); r = s; } }
  return v ? r.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '') : r;
}

let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { action.run(); el.classList.remove('on'); };
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), action ? 6000 : 2600);
}

async function getJSON(url, opt = {}, tries = 2) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(url, { ...opt, signal: opt.signal || AbortSignal.timeout?.(25000) });
      if (r.status === 429 && i < tries) { await sleep(900 * (i + 1)); continue; }
      if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return await r.json();
    } catch (e) {
      if (e.name === 'AbortError' || e.name === 'TimeoutError' || (e.status >= 400 && e.status < 500) || i >= tries) throw e;
      await sleep(500 * (i + 1));
    }
  }
}
const memo = new Map();
const once = (key, fn) => { if (!memo.has(key)) memo.set(key, fn().catch(e => { memo.delete(key); throw e; })); return memo.get(key); };
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));
  return out;
}
function parseHash() {
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  return { parts: path.split('/'), q: new URLSearchParams(qs || '') };
}
// index of the item whose date is closest to `date`, if within `days`
function closestByDate(list, date, f, days) {
  const d0 = Date.parse(date); if (Number.isNaN(d0)) return -1;
  let best = -1, bd = Infinity;
  list.forEach((x, i) => { const d = Date.parse(f(x)); if (!Number.isNaN(d) && Math.abs(d - d0) < bd) { bd = Math.abs(d - d0); best = i; } });
  return bd <= days * 864e5 ? best : -1;
}

/* ---------- data: Shikimori (primary) ---------- */
const SHIKI = 'https://shikimori.io';
const gql = (query, signal) => getJSON(SHIKI + '/api/graphql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }), signal })
  .then(r => { if (r.errors) throw new Error(r.errors[0].message); return r.data; });
const ENTRY_FIELDS = 'id russian name english kind status episodes episodesAired duration nextEpisodeAt airedOn{year date} poster{mainUrl}';

function toEntry(a) {
  const count = a.status === 'ongoing' ? a.episodesAired : (a.episodes || a.episodesAired);
  return { id: +a.id, title: a.russian || a.name, ru: a.russian || '', en: a.english || '', name: a.name, english: a.english, kind: a.kind, status: a.status,
    count: a.kind === 'movie' ? 1 : count || 0, year: a.airedOn?.year, date: a.airedOn?.date || '', poster: a.poster?.mainUrl || '', duration: a.duration || 24, next: a.nextEpisodeAt || '' };
}

/* ---------- data: AniList (backup when Shikimori is down) ---------- */
const alq = (query, variables, signal) => getJSON('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }), signal })
  .then(r => { if (r.errors && !r.data) throw new Error(r.errors[0].message); return r.data; });
const AL_FIELDS = 'idMal format status episodes duration nextAiringEpisode{episode airingAt} startDate{year month day} title{romaji english native} synonyms coverImage{large}';
const AL_KIND = { TV: 'tv', TV_SHORT: 'tv', MOVIE: 'movie', OVA: 'ova', ONA: 'ona', SPECIAL: 'special', MUSIC: 'music' };
function alEntry(m) {
  // Cyrillic synonyms mix Russian and Ukrainian: skip і/ї/є/ґ, prefer ы/э/ё/ъ
  const cyr = (m.synonyms || []).filter(s => /[а-яё]/i.test(s) && !/[іїєґ]/i.test(s));
  const ru = cyr.find(s => /[ыэёъ]/i.test(s)) || cyr[0] || '';
  const ongoing = m.status === 'RELEASING';
  const d = m.startDate || {};
  const count = m.format === 'MOVIE' ? 1 : ongoing ? Math.max(0, (m.nextAiringEpisode?.episode || 1) - 1) : (m.episodes || 0);
  return { id: m.idMal, title: ru || m.title.english || m.title.romaji, ru, en: m.title.english || '', name: m.title.romaji, english: m.title.english, kind: AL_KIND[m.format] || 'tv',
    status: ongoing ? 'ongoing' : m.status === 'NOT_YET_RELEASED' ? 'anons' : 'released', count, year: d.year,
    date: d.year ? `${d.year}-${String(d.month || 1).padStart(2, '0')}-${String(d.day || 1).padStart(2, '0')}` : '', poster: m.coverImage?.large || '',
    duration: m.duration || 24, next: m.nextAiringEpisode?.airingAt ? new Date(m.nextAiringEpisode.airingAt * 1000).toISOString() : '' };
}
async function anilistSearch(q, signal) {
  const d = await alq(`query($q:String){Page(perPage:8){media(search:$q,type:ANIME,sort:SEARCH_MATCH){${AL_FIELDS}}}}`, { q }, signal);
  return d.Page.media.filter(m => m.idMal && m.format !== 'MUSIC').map(alEntry);
}
async function anilistAnime(id) {
  const Q = `query($id:Int){Media(idMal:$id,type:ANIME){${AL_FIELDS} description(asHtml:false) genres averageScore relations{edges{relationType node{${AL_FIELDS} type}}}}}`;
  const get = mal => once('al:' + mal, () => alq(Q, { id: mal }).then(d => d.Media));
  const self = await get(id);
  if (!self) throw new Error('not found');
  // rebuild the story line by walking prequels/sequels; ponytail: capped at 12 hops each way
  const MAIN = ['TV', 'TV_SHORT', 'ONA', 'MOVIE'];
  const step = (m, rel) => m.relations.edges.find(e => e.relationType === rel && e.node.type === 'ANIME' && e.node.idMal && MAIN.includes(e.node.format))?.node;
  const back = [], fwd = [];
  for (let cur = self, i = 0; i < 12; i++) { const p = step(cur, 'PREQUEL'); if (!p || back.some(x => x.idMal === p.idMal)) break; cur = await get(p.idMal); back.unshift(cur); }
  for (let cur = self, i = 0; i < 12; i++) { const n = step(cur, 'SEQUEL'); if (!n || fwd.some(x => x.idMal === n.idMal)) break; cur = await get(n.idMal); fwd.push(cur); }
  const s = alEntry(self);
  const main = [...back, self, ...fwd].map(alEntry).filter(e => e.count > 0).sort(byDate);
  const inMain = new Set(main.map(e => e.id));
  const other = self.relations.edges.filter(e => e.node.type === 'ANIME' && e.node.idMal && !inMain.has(e.node.idMal) && e.node.format !== 'MUSIC')
    .map(e => alEntry(e.node)).filter(e => e.count > 0).sort(byDate);
  const desc = stripTags(self.description).replace(/\n{3,}/g, '\n\n');
  return { ...s, japanese: self.title.native, score: self.averageScore ? (self.averageScore / 10).toFixed(1) : null, url: `${SHIKI}/animes/${id}`,
    descRu: '', descEn: desc, genresRu: [], genresEn: self.genres || [], main: main.length ? main : [s].filter(e => e.count > 0), other, backup: true };
}

/* ---------- search ---------- */
const searchCache = new Map();
async function searchAnime(q, signal) {
  const key = q.toLowerCase().trim();
  if (searchCache.has(key)) return searchCache.get(key);
  let res;
  try {
    const d = await gql(`{animes(search:${JSON.stringify(q)},limit:8,kind:"!music,!cm,!pv"){${ENTRY_FIELDS} score}}`, signal);
    res = d.animes.map(a => ({ ...toEntry(a), score: a.score }));
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    res = await anilistSearch(q, signal);
    res.backup = true;
  }
  searchCache.set(key, res);
  return res;
}
async function animesByIds(ids) {
  const out = [];
  for (const chunk of chunks(ids, 50)) {
    try { out.push(...(await gql(`{animes(ids:"${chunk.join(',')}",limit:50){${ENTRY_FIELDS}}}`)).animes.map(toEntry)); }
    catch { out.push(...(await alq(`query($ids:[Int]){Page(perPage:50){media(idMal_in:$ids,type:ANIME){${AL_FIELDS}}}}`, { ids: chunk })).Page.media.map(alEntry)); }
  }
  return out;
}
// Typo fallbacks, cheapest first: "Ванпис" -> "Ван пис" (split a glued word), then drop trailing letters.
function typoVariants(v) {
  const tries = [];
  if (!/\s/.test(v) && v.length >= 5) for (let d = 0; d <= v.length; d++) for (const i of [Math.floor(v.length / 2) + d, Math.floor(v.length / 2) - d]) {
    const x = v.slice(0, i) + ' ' + v.slice(i);
    if (i >= 2 && i <= v.length - 2 && !tries.includes(x)) tries.push(x);
  }
  for (let cut = v; cut.length > 4;) tries.push(cut = cut.slice(0, -1).trim());
  return tries;
}
async function smartSearch(queries, signal) {
  for (const q of queries) { const r = await searchAnime(q, signal); if (r.length) return { items: r, fuzzy: false }; }
  let n = 0;
  for (const q of queries) for (const x of typoVariants(q)) {
    if (n++ >= 6) return { items: [], fuzzy: false };
    const r = await searchAnime(x, signal);
    if (r.length) return { items: r, fuzzy: true };
  }
  return { items: [], fuzzy: false };
}

/* ---------- links and page titles: shikimori, MAL, AniList, Kitsu, any anime site ---------- */
const LINK_STOP = new Set('anime animes watch online smotret onlayn onlain serial series season sezon episode episodes seriya seria catalog item items release releases title titles video videos tv ru en www html php page manga tip play player view details info category tags search'.split(' '));
function epFrom(s) {
  const m = s.match(/(?:episode|seriya|seriia|seria|серия|эпизод)[-_\s=#:№]*(\d{1,4})(?!\d)/i)
    || s.match(/(\d{1,4})[-_\s]*(?:-?(?:я|й)\s*)?(?:seriya|seria|серия|серии|эпизод|episode)/i)
    || s.match(/(?:^|[^a-z])(?:ep|e)[-_]?(\d{1,4})(?!\d)/i);
  return m ? +m[1] : null;
}
function seasonFrom(s) {

  const m = s.match(/(\d{1,2})[-_\s]*(?:-?й\s*)?(?:season|sezon|сезон)/i) || s.match(/(?:season|sezon|сезон)[-_\s=#:№]*(\d{1,2})(?!\d)/i) || s.match(/(?:^|[^a-z])s(\d{1,2})e\d/i);
  return m ? +m[1] : null;
}

  const one = { a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й', y: 'ы', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т', u: 'у', f: 'ф', h: 'х', c: 'ц', w: 'в', x: 'кс', q: 'к', "'": 'ь' };
  const w = s.toLowerCase(); let out = '';
  for (let i = 0; i < w.length;) { const p = pairs.find(([l]) => w.startsWith(l, i)); if (p) { out += p[1]; i += p[0].length; } else { out += one[w[i]] ?? w[i]; i++; } }

  return path.split('/').map(x => x.replace(/\.(html?|php|aspx?)$/i, '')).filter(Boolean)
    .filter(x => !/^(season|sezon|episode|seriya|seria|ep|e|s)[-_]?\d+$/i.test(x) && /[a-zа-яё]{3}/i.test(x) && !/^[A-Z0-9]{6,}$/.test(x))
    .map(clean).filter(Boolean).sort((a, b) => b.split(' ').length - a.split(' ').length || b.length - a.length)[0] || '';
}
function parseLink(text) {

  if (/anilist\.co$/.test(host) && (m = path.match(/\/anime\/(\d+)/))) return { ...info, anilist: +m[1] };

  return title ? { ...info, title } : null;
}
async function resolveLink(L, signal) {
  if (L.mal) return animesByIds([L.mal]);
  if (L.anilist) { const d = await alq('query($id:Int){Media(id:$id,type:ANIME){idMal}}', { id: L.anilist }, signal); return d.Media?.idMal ? animesByIds([d.Media.idMal]) : []; }
  if (L.kitsu) {
    const f = /^\d+$/.test(L.kitsu) ? `filter[id]=${L.kitsu}` : `filter[slug]=${encodeURIComponent(L.kitsu)}`;
    const r = await getJSON(`https://kitsu.io/api/edge/anime?${f}&include=mappings&fields[anime]=id`, { signal });
    const mp = (r.included || []).find(x => x.attributes?.externalSite === 'myanimelist/anime');
    return mp ? animesByIds([+mp.attributes.externalId]) : [];

// Guessed titles (URL slugs, history lines) are noisy, so rank candidates from every spelling variant
// by how close their names are to what we guessed, instead of trusting the first non-empty search.
const normTitle = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const bigrams = s => { const x = ` ${normTitle(s)} `, m = new Map(); for (let i = 0; i < x.length - 1; i++) { const b = x.slice(i, i + 2); m.set(b, (m.get(b) || 0) + 1); } return m; };
function sim(a, b) {
  const A = bigrams(a), B = bigrams(b); let inter = 0, n = 0;
  for (const [k, v] of A) { n += v; inter += Math.min(v, B.get(k) || 0); }
  for (const v of B.values()) n += v;
  return n ? 2 * inter / n : 0;
}
const titleSim = (q, x) => Math.max(0, ...[x.title, x.name, x.english].filter(Boolean).flatMap(s => [sim(q, s), sim(q, s.split(/[:.(]/)[0])]));
async function searchByTitle(raw, signal) {
  const qs = [raw, dedouble(raw), lat2cyr(raw)].filter((x, i, a) => x && a.indexOf(x) === i);
  const found = new Map();
  const consider = list => list.forEach(x => { const s = Math.max(...qs.map(q => titleSim(q, x))); if (!found.has(x.id) || found.get(x.id).s < s) found.set(x.id, { x, s }); });
  for (const q of qs) consider(await searchAnime(q, signal));
  const best = () => Math.max(0, ...[...found.values()].map(v => v.s));
  for (const q of qs) for (const x of typoVariants(q).slice(0, 3)) { if (best() >= .6) break; consider(await searchAnime(x, signal)); }
  return [...found.values()].filter(v => v.s >= .3).sort((a, b) => b.s - a.s).map(v => v.x).slice(0, 8);
}

function loadAnime(id) {
  return once('anime:' + id, async () => {
    let d, fr;
    try {
      [d, fr] = await Promise.all([
        gql(`{animes(ids:"${+id}",limit:1){${ENTRY_FIELDS} japanese score url description genres{russian name} chronology{${ENTRY_FIELDS}}}}`),
        getJSON(`${SHIKI}/api/animes/${+id}/franchise`).catch(() => ({ links: [] })),
      ]);
    } catch { return anilistAnime(id); }
    const a = d.animes[0];
    if (!a) return anilistAnime(id);
    const self = toEntry(a);
    const chron = (a.chronology?.length ? a.chronology : [a]).map(toEntry).filter(e => !SKIP_KINDS.has(e.kind) && e.count > 0);
    if (!chron.some(e => e.id === self.id) && self.count > 0) chron.push(self);
    const chain = mainChain(self.id, fr.links || []);
    const inChain = new Set(chain);
    const main = chron.filter(e => inChain.has(e.id)).sort(byDate);
    const other = chron.filter(e => !inChain.has(e.id)).sort(byDate);
    return { ...self, japanese: a.japanese, score: a.score, url: a.url, descRu: stripBB(a.description), descEn: '',
      genresRu: (a.genres || []).map(g => g.russian), genresEn: (a.genres || []).map(g => g.name), main: main.length ? main : [self].filter(e => e.count > 0), other };
  });
}

// Story line: walk prequels back to the root, then follow sequels forward.
// Shikimori links read "target is <relation> of source".
function mainChain(id, links) {
  const next = new Map(), prev = new Map();
  for (const l of links) {
    if (l.relation === 'sequel') { if (!next.has(l.source_id)) next.set(l.source_id, l.target_id); if (!prev.has(l.target_id)) prev.set(l.target_id, l.source_id); }
    if (l.relation === 'prequel') { if (!prev.has(l.source_id)) prev.set(l.source_id, l.target_id); if (!next.has(l.target_id)) next.set(l.target_id, l.source_id); }
  }
  let root = id; const seen = new Set([id]);
  while (prev.has(root) && !seen.has(prev.get(root))) { root = prev.get(root); seen.add(root); }
  const chain = [root]; const used = new Set([root]);
  for (let c = root; next.has(c) && !used.has(next.get(c));) { c = next.get(c); chain.push(c); used.add(c); }
  return chain.includes(id) ? chain : [id];
}

/* ---------- episodes: Kitsu (stills, titles, short synopses) ---------- */
const kitsuIds = store.get('kitsu', {});

const cleanSyn = s => (s || '').split('\n').filter(l => !/^\s*[\(\[](source|written by)/i.test(l)).join('\n').trim();
const kitsuShape = a => { const x = a.titles || {}; return { title: a.canonicalTitle || x.en || x.en_us || x.en_jp || '', alt: x.ja_jp || x.en_jp || '', synopsis: cleanSyn(a.synopsis || a.description), thumb: a.thumbnail?.original || '', airdate: a.airdate || '' }; };

/* ---------- episodes: TVmaze (stills + synopses; sequels mapped by air date) ---------- */
// "One Punch Man 2nd Season" -> "One Punch Man": sequels usually live inside the first season's show/list
function baseName(s) {
  let x = (s || '').trim(), prev;
  do {
    prev = x;
    x = x.replace(/\s*[:\-–]\s*(the\s+)?final\s+season.*$/i, '').replace(/\s*(part|cour)\s*\d+$/i, '').replace(/\s*\d+(st|nd|rd|th)\s+season$/i, '')
      .replace(/\s*season\s*\d+$/i, '').replace(/\s+\d+$/, '').replace(/\s+(ii|iii|iv)$/i, '').trim();
  } while (x !== prev);
  return x;
}
function tvmazeEpisodes(entry) {
  return once('tvm:' + entry.id, async () => {
    const names = [...new Set([entry.english, entry.name, baseName(entry.english), baseName(entry.name)].filter(Boolean))].slice(0, 3);
    for (const q of names) {
      const res = await getJSON('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(q)).catch(() => []);
      for (const s of res.map(r => r.show).filter(s => s.language === 'Japanese' || s.genres?.includes('Anime') || s.type === 'Animation').slice(0, 3)) {
        const y = +s.premiered?.slice(0, 4);
        if (entry.year && y && y > entry.year) continue;
        const eps = (await once('tvme:' + s.id, () => getJSON(`https://api.tvmaze.com/shows/${s.id}/episodes`)).catch(() => [])).filter(e => e.number != null);
        const i = entry.date ? closestByDate(eps, entry.date, e => e.airdate, 4) : (y === entry.year ? 0 : -1);
        if (i >= 0) return eps.slice(i);
        if (!entry.date && y === entry.year) return eps;
      }
    }
    return [];
  });
}

/* ---------- scope helpers ---------- */
function locate(entries, abs) {
  for (const e of entries) { if (abs < e.count) return { e, n: abs + 1 }; abs -= e.count; }
  return null;
}
const totalOf = entries => entries.reduce((n, e) => n + e.count, 0);
const offsetOf = (entries, idx) => totalOf(entries.slice(0, idx));
const epShort = (e, n) => e.kind === 'movie' ? t('фильм') : t('серия {n}', { n });
function label(entries, abs, short) {
  const p = locate(entries, abs);
  if (!p) return '';
  if (p.e.kind === 'movie') return short ? t('фильм') : nm(p.e);
  return entries.length > 1 && !short ? `${nm(p.e)}, ${t('серия {n}', { n: p.n })}` : t('серия {n}', { n: p.n });
}
// "8-ю серию «Title»" for use after помнишь/не помнишь
function acc(entries, abs) {
  const p = locate(entries, abs); if (!p) return '';
  if (p.e.kind === 'movie') return t('фильм «{title}»', { title: nm(p.e) });
  return t('{n}-ю серию', { n: p.n }) + (entries.length > 1 ? t(' «{title}»', { title: nm(p.e) }) : '');
}
// Episode number from a link, history, or screenshot -> 1-based position in the chosen parts.
function hintPos(entries, season, ep, entryId) {
  if (!ep || !entries.length) return 0;
  const own = entryId && entries.find(e => e.id === entryId);
  if (own) return offsetOf(entries, entries.indexOf(own)) + Math.min(ep, own.count);
  if (season > 1) {
    const tvs = entries.filter(e => e.kind === 'tv' || e.kind === 'ona');
    const x = tvs[season - 1];
    if (x) return offsetOf(entries, entries.indexOf(x)) + Math.min(ep, x.count);
  }
  return Math.min(ep, totalOf(entries));
}
// Approximate weekly schedule: how many episodes were out by the end of a given year.
function airedBy(entries, year) {
  const cut = new Date(year + 1, 1, 15).getTime();
  let n = 0;
  for (const e of entries) {
    const d0 = e.date ? Date.parse(e.date) : NaN;
    if (Number.isNaN(d0)) { n += e.count; continue; }
    for (let i = 0; i < e.count; i++) { if (d0 + (e.kind === 'movie' ? 0 : i * 7 * 864e5) > cut) return n; n++; }
  }
  return n;
}
// Minutes left after position `pos` (last watched, 0-based)
function minutesLeft(entries, pos) {
  let m = 0, abs = 0;
  for (const e of entries) for (let i = 0; i < e.count; i++, abs++) if (abs > pos) m += e.duration || 24;
  return m;
}
const fmtDur = min => { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? t('{h} ч {m} мин', { h, m }) : t('{h} ч', { h })) : t('{m} мин', { m }); };

const libItem = ({ id, title, ru, en, poster, url, entries, pos, at }) => { const total = Math.max(1, totalOf(entries)); return { id, title, ru, en, poster, url, entries, total, pos: Math.max(-1, Math.min(pos, total - 1)), at: at || Date.now(), seen: total }; };
function upsertLib(item) { const l = lib().filter(x => x.id !== item.id); l.unshift(item); saveLib(l); }
const validLib = data => Array.isArray(data) ? data.filter(x => x && Number.isFinite(x.id) && Array.isArray(x.entries) && Number.isFinite(x.pos) && Number.isFinite(x.total)) : [];
function mergeLib(items) {
  const m = new Map(lib().map(x => [x.id, x]));
  for (const x of items) { const cur = m.get(x.id); if (!cur || (x.at || 0) >= (cur.at || 0)) m.set(x.id, x); }
  saveLib([...m.values()].sort((a, b) => (b.at || 0) - (a.at || 0)));

function rememberRecent(a) { store.set('recent', [{ id: a.id, title: a.title, ru: a.ru, en: a.en, name: a.name, poster: a.poster, year: a.year, count: a.count }, ...recent().filter(x => x.id !== a.id)].slice(0, 12)); }
// Transfer code: the library compressed into one copy-pasteable string.
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function packLib(l) {
  const bytes = new TextEncoder().encode(JSON.stringify(l));
  if (typeof CompressionStream === 'undefined') return 'NKS0.' + b64u(bytes);
  const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  return 'NKS1.' + b64u(z);
}
async function unpackLib(code) {
  const [tag, body] = code.trim().replace(/^.*#\/sync\//, '').split('.');
  const bytes = unb64u(body || '');
  const json = tag === 'NKS1' ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : tag === 'NKS0' ? new TextDecoder().decode(bytes) : '';
  return validLib(JSON.parse(json));
}
// New episodes and next air dates of titles in the library (checked once per visit).
let refreshed = false;
async function refreshOngoing(repaint) {
  if (refreshed) return; refreshed = true;
  const ids = [...new Set(lib().map(x => x.entries[x.entries.length - 1]?.id).filter(Boolean))];
  if (!ids.length) return;
  const fresh = new Map((await animesByIds(ids).catch(() => [])).map(e => [e.id, e]));
  const l = lib(); let changed = false;
  for (const x of l) {
    const last = x.entries[x.entries.length - 1], f = fresh.get(last?.id);
    if (!f) continue;
    if (f.count > last.count) { x.seen ??= x.total; last.count = f.count; x.total = totalOf(x.entries); changed = true; }
    if (last.status !== f.status || last.next !== f.next || !last.duration) { last.status = f.status; last.next = f.next; last.duration ||= f.duration; changed = true; }
  }
  if (changed) { saveLib(l); repaint(); }
}

/* ---------- views: import from Shikimori / AniList ---------- */
const RATE = { watching: 'w', rewatching: 'r', on_hold: 'h', dropped: 'd', completed: 'c', planned: 'p', CURRENT: 'w', REPEATING: 'r', PAUSED: 'h', DROPPED: 'd', COMPLETED: 'c', PLANNING: 'p' };
const rateName = s => ({ w: t('Смотрю'), r: t('Пересматриваю'), h: t('Отложено'), d: t('Брошено'), c: t('Просмотрено'), p: t('В планах') }[s] || s);
const UNFINISHED = new Set(['w', 'r', 'h', 'd']);
async function loadProfile(src, nick) {
  if (src === 'shiki') {
    const rates = await getJSON(`${SHIKI}/api/users/${encodeURIComponent(nick)}/anime_rates?limit=5000&is_nickname=1`);
    return rates.filter(r => r.anime).map(r => {
      const a = r.anime, count = a.kind === 'movie' ? 1 : (a.status === 'ongoing' ? a.episodes_aired : (a.episodes || a.episodes_aired)) || 0;
      return { status: RATE[r.status] || r.status, progress: r.episodes || 0, at: Date.parse(r.updated_at) || Date.now(),
        entry: { id: a.id, title: a.russian || a.name, ru: a.russian || '', en: '', name: a.name, english: '', kind: a.kind, status: a.status, count, year: +(a.aired_on || '').slice(0, 4) || null, date: a.aired_on || '', poster: a.image?.original ? SHIKI + a.image.original : '', duration: 24 } };
    });
  }
  const d = await alq(`query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{entries{status progress updatedAt media{${AL_FIELDS}}}}}}`, { u: nick });
  return d.MediaListCollection.lists.flatMap(l => l.entries).filter(x => x.media.idMal)
    .map(x => ({ status: RATE[x.status] || x.status, progress: x.progress || 0, at: (x.updatedAt || 0) * 1000 || Date.now(), entry: alEntry(x.media) }));
}
function viewImport() {
  document.title = t('Импорт списка');

    <div class="seg" id="src"><button data-src="shiki">Shikimori</button><button data-src="anilist">AniList</button></div>
    <form class="search" id="nick-form" style="margin-top:16px"><label for="nick">${esc(t('Ник'))}</label>
      <div class="field"><i class="ph ph-user"></i><input id="nick" autocomplete="off" spellcheck="false" placeholder="${esc(t('Ник или ссылка на профиль'))}"><button class="btn primary sm">${esc(t('Загрузить'))}</button></div></form>
    <div id="imp-out"></div></div>`;
  const segs = () => $$('#src button').forEach(b => b.setAttribute('aria-pressed', b.dataset.src === src));

    out.innerHTML = `<p class="mut" style="margin:20px 0 0">${esc(t('Найдено: {n}. Отмечены те, что ты не досмотрел.', { n: rows.length }))}</p>
      <div class="chips"><button class="btn ghost sm" data-sel="unfinished">${esc(t('Недосмотренные'))}</button><button class="btn ghost sm" data-sel="all">${esc(t('Все'))}</button><button class="btn ghost sm" data-sel="none">${esc(t('Ничего'))}</button></div>
      <div class="list">${rows.map((r, i) => `<label class="imp-row"><input type="checkbox" value="${i}" ${picked.has(i) ? 'checked' : ''}>${img(r.entry.poster)}<div><div class="t">${esc(nm(r.entry))}</div><div class="s">${esc(rateName(r.status))} · ${esc(r.progress ? t('{a} из {b}', { a: r.progress, b: r.entry.count || '?' }) : t('не начато'))}</div></div><span></span></label>`).join('')}</div>
      <div class="startbar"><button class="btn primary" id="add" ${picked.size ? '' : 'disabled'}><i class="ph ph-plus"></i><span>${esc(addLabel())}</span></button></div>`;
    $$('.imp-row input', out).forEach(c => c.onchange = () => { c.checked ? picked.add(+c.value) : picked.delete(+c.value); $('#add').disabled = !picked.size; $('#add span').textContent = addLabel(); });
    $$('[data-sel]', out).forEach(b => b.onclick = () => {

      paint();
    });

      const items = [...picked].map(i => rows[i]).map(r => libItem({ id: r.entry.id, title: r.entry.title, ru: r.entry.ru, en: r.entry.en, poster: r.entry.poster, url: `${SHIKI}/animes/${r.entry.id}`,
        entries: [{ ...r.entry, count: Math.max(r.entry.count, r.progress, 1) }], pos: r.progress - 1, at: r.at }));

  $('#nick-form').onsubmit = async e => {

    if (m) { nick = decodeURIComponent(m[1]); src = /anilist/i.test($('#nick').value) ? 'anilist' : 'shiki'; segs(); }
    if (!nick) return $('#nick').focus();
    out.innerHTML = progressHTML(t('Загружаю список'));
    try {
      rows = (await loadProfile(src, nick)).sort((a, b) => (UNFINISHED.has(b.status) - UNFINISHED.has(a.status)) || b.at - a.at);
      picked = new Set(rows.map((r, i) => i).filter(i => UNFINISHED.has(rows[i].status) && rows[i].progress > 0));
      if (!rows.length) out.innerHTML = `<p class="mut" style="margin-top:20px">${esc(t('Список пуст.'))}</p>`; else paint();
    } catch (err) {
      out.innerHTML = `<p class="mut" style="margin-top:20px">${esc(err.status === 404 || /private|not found/i.test(err.message) ? t('Такого профиля нет или он закрыт. Проверь ник и настройки приватности.') : t('Сервис не ответил. Попробуй ещё раз.'))}</p>`;
    }
  };
}
