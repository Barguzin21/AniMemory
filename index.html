/* ---------- views: screenshot search (trace.moe) ---------- */
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function viewScreen() {
  document.title = t('Поиск по скриншоту');
  const touch = matchMedia('(hover: none)').matches;
  app.innerHTML = `<div class="wrap section fade-in narrow">
    <h2 class="page-h">${esc(t('Найти по скриншоту'))}</h2>
    <p class="mut lead-p">${esc(t('Есть кадр или скриншот из серии? Сервис trace.moe узнает аниме, номер серии и даже минуту. Бесплатно, до 100 поисков в месяц.'))}</p>
    <label class="drop" id="drop" tabindex="0"><i class="ph ph-image-square"></i><b>${esc(touch ? t('Выбери скриншот') : t('Перетащи картинку сюда'))}</b><span class="mut">${esc(touch ? t('Нажми, чтобы выбрать фото из галереи') : t('или нажми, чтобы выбрать файл. Можно вставить из буфера: Ctrl+V'))}</span><input type="file" accept="image/*" id="shot-file" hidden></label>
    <form class="search" id="url-form" style="margin-top:12px"><label for="img-url">${esc(t('Ссылка на картинку'))}</label>
      <div class="field"><i class="ph ph-link"></i><input id="img-url" autocomplete="off" spellcheck="false" placeholder="${esc(t('Или вставь ссылку на картинку'))}"><button class="btn primary sm">${esc(t('Найти'))}</button></div></form>
    <div id="shot-out"></div></div>`;
  const out = $('#shot-out');
  const run = async ({ file, url }) => {
    out.innerHTML = progressHTML(t('Ищу этот кадр среди миллионов'));
    try {
      let body; if (file) { body = new FormData(); body.append('image', file); }
      const r = await getJSON('https://api.trace.moe/search?anilistInfo&cutBorders' + (url ? '&url=' + encodeURIComponent(url) : ''), file ? { method: 'POST', body } : {}, 0);
      const seen = new Set();
      let hits = (r.result || []).filter(x => x.anilist?.idMal && !x.anilist.isAdult).filter(x => { const k = x.anilist.idMal + ':' + x.episode; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 3);
      if (hits[0]?.similarity >= .9) hits = hits.filter(h => h.similarity >= .87); // a confident hit: drop the noise
      if (!hits.length) { out.innerHTML = `<p class="mut" style="margin-top:20px">${esc(t('Не узнал этот кадр. Попробуй скриншот без рамок и надписей, прямо из видео.'))}</p>`; return; }
      const names = new Map((await animesByIds(hits.map(h => h.anilist.idMal)).catch(() => [])).map(e => [e.id, e]));
      out.innerHTML = `<div class="matches">${hits.map(h => {
        const e = names.get(h.anilist.idMal), ep = Array.isArray(h.episode) ? h.episode[0] : h.episode;
        const title = e ? nm(e) : (h.anilist.title.english || h.anilist.title.romaji);
        const sure = h.similarity >= .9;
        return `<div class="match fade-in">
          <div class="img">${h.video ? `<video src="${esc(h.video)}&size=m" muted autoplay loop playsinline poster="${esc(h.image || '')}"></video>` : img(h.image)}</div>
          <div><div class="k"><b>${esc(t('совпадение {p}%', { p: Math.round(h.similarity * 100) }))}</b>${sure ? '' : ' · ' + esc(t('может быть не то'))}</div>
            <h3>${esc(title)}</h3>
            <p class="mut" style="margin:0 0 8px">${esc([ep ? t('серия {n}', { n: ep }) : '', t('момент {time}', { time: mmss(h.from) })].filter(Boolean).join(', '))}</p>
            <div class="row"><a class="btn primary sm" href="#/a/${h.anilist.idMal}${ep ? `?ep=${ep}&entry=${h.anilist.idMal}&src=shot` : ''}"><i class="ph ph-arrow-right"></i>${esc(t('Открыть тайтл'))}</a></div></div></div>`;
      }).join('')}</div>${r.quota ? `<p class="mut" style="font-size:13px;margin-top:12px">${esc(t('Осталось поисков в этом месяце: {n}', { n: Math.max(0, r.quota - (r.quotaUsed || 0)) }))}</p>` : ''}`;
    } catch (e) {
      const msg = e.status === 402 || e.status === 429 ? t('Лимит бесплатных поисков на этот месяц закончился.')
        : url && (e.status === 400 || e.status === 404) ? t('Не получилось скачать картинку по ссылке. Проверь ссылку или загрузи файл.')
        : t('Сервис trace.moe не ответил. Попробуй ещё раз.');
      out.innerHTML = `<p class="mut" style="margin-top:20px">${esc(msg)}</p>`;
    }
  };
  const drop = $('#drop');
  $('#shot-file').onchange = e => { const f = e.target.files[0]; if (f) run({ file: f }); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) run({ file: f }); };
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#shot-file').click(); } };
  $('#url-form').onsubmit = e => { e.preventDefault(); const u = $('#img-url').value.trim(); if (/^https?:\/\//i.test(u)) run({ url: u }); else $('#img-url').focus(); };
  const onPaste = e => { const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/')); if (f) { e.preventDefault(); run({ file: f }); } };
  addEventListener('paste', onPaste);
  cleanup = () => removeEventListener('paste', onPaste);
}

/* ---------- views: title ---------- */
const METHODS = {
  frames: { icon: 'ph-cards', name: 'По кадрам', desc: 'Показываем кадр из серии, ты отвечаешь «помню» или «нет». Самый точный способ.' },
  grid: { icon: 'ph-squares-four', name: 'Сетка кадров', desc: 'Шесть кадров за раз, выбираешь самый поздний знакомый. На длинных тайтлах шагов в 2-3 раза меньше.' },
  describe: { icon: 'ph-chat-text', name: 'Опишу словами', desc: 'Напиши, что помнишь последним. Сайт сравнит это с подробными пересказами всех серий, а ИИ в браузере поймёт смысл, даже если слова другие.' },
  themes: { icon: 'ph-music-notes', name: 'По опенингам', desc: 'Музыка хорошо будит память. Послушай опенинги и эндинги по порядку и выбери последний, который помнишь.' },
};
async function viewTitle(id, q = new URLSearchParams()) {
  loadingView();
  let a;
  try { a = await loadAnime(id); } catch { return errorView(t('Не удалось загрузить тайтл ни с Shikimori, ни с AniList.'), () => viewTitle(id, q)); }
  const { parts } = parseHash();
  if (parts[0] !== 'a' || +parts[1] !== id || parts[2]) return;
  document.title = nm(a);
  rememberRecent(a);
  const all = [...a.main, ...a.other];
  const saved = session?.id === id ? session : null;
  let mode = 'all', method = METHODS[settings.method] ? settings.method : 'frames', memDraft = '', descToken = 0, themeToken = 0;
  let picked = new Set(a.main.map(e => e.id));
  if (a.other.some(e => e.id === id)) picked = new Set([id]);
  if (saved) { picked = new Set(saved.entries.map(e => e.id)); mode = 'custom'; }
  const inLib = lib().find(x => x.id === id);
  const hintEp = +q.get('ep') || 0, hintSeason = +q.get('season') || 0, hintEntry = +q.get('entry') || 0;
  const hintSrc = { link: t('Из ссылки'), history: t('Из истории'), shot: t('Со скриншота') }[q.get('src')] || t('Подсказка');
  if (hintEntry && !picked.has(hintEntry) && all.some(e => e.id === hintEntry)) picked.add(hintEntry);
  const years = all.map(e => e.year).filter(Boolean), y0 = Math.min(...years), y1 = new Date().getFullYear();
  const entryRow = e => `<label class="entry${e.id === id ? ' cur' : ''}"><input type="checkbox" value="${e.id}" ${picked.has(e.id) ? 'checked' : ''}>${img(e.poster)}<div><div class="t" data-this="${esc(t('этот'))}">${esc(nm(e))}</div><div class="s">${esc([kindName(e.kind), e.year, e.status === 'ongoing' ? t('онгоинг') : ''].filter(Boolean).join(' · '))}</div></div><span class="n mono">${e.kind === 'movie' ? '1' : e.count}</span></label>`;
  const desc = lang === 'ru' ? (a.descRu || a.descEn) : (a.descEn || a.descRu);
  const descLong = desc.length > 320;
  const genres = lang === 'ru' && a.genresRu.length ? a.genresRu : a.genresEn;
  const airs = nextEpisodeNote(a.main[a.main.length - 1]);

  app.innerHTML = `<div class="backdrop">${a.poster ? `<img src="${esc(a.poster)}" alt="">` : ''}</div>
  <div class="wrap fade-in">
    <div class="title-head">
      <div class="poster">${img(a.poster, nm(a))}</div>
      <div>
        <h1>${esc(nm(a))}</h1>
        <p class="orig">${esc([a.name, a.japanese].filter(x => x && x !== nm(a)).join(' · '))}</p>
        <div class="facts">
          ${a.year ? `<span><i class="ph ph-calendar-blank"></i>${a.year}</span>` : ''}
          <span><i class="ph ph-television-simple"></i>${esc(kindName(a.kind))}</span>
          ${a.count ? `<span><i class="ph ph-film-strip"></i>${esc(a.kind === 'movie' ? t('фильм') : epsWord(a.count))}</span>` : ''}
          ${a.score ? `<span><i class="ph ph-star"></i>${a.score}</span>` : ''}
          ${a.status ? `<span>${esc(statusName(a.status))}</span>` : ''}
          ${airs ? `<span><i class="ph ph-bell-simple"></i>${esc(airs)}</span>` : ''}
        </div>
      </div>
      <div class="desc-wrap">
        ${desc ? `<p class="desc ${descLong ? 'clamp' : ''}" id="desc">${esc(desc)}</p>${descLong ? `<button class="linkbtn" id="more">${esc(t('Читать полностью'))}</button>` : ''}` : ''}
        ${genres.length ? `<p class="mut" style="font-size:14px;margin:12px 0 0">${esc(genres.slice(0, 6).join(', '))}</p>` : ''}
        ${inLib ? `<p style="margin:14px 0 0;font-size:14px"><i class="ph ph-bookmark-simple" style="color:var(--acc)"></i> ${esc(t('В твоём списке: {what}', { what: inLib.pos < 0 ? t('ещё не начато') : t('последняя просмотренная: {ep}', { ep: label(inLib.entries, inLib.pos) }) }))}</p>` : ''}
        ${a.backup ? `<p class="mut" style="font-size:13px;margin:12px 0 0"><i class="ph ph-info"></i> ${esc(t('Shikimori сейчас не отвечает, данные взяты с AniList.'))}</p>` : ''}
      </div>
    </div>

    <section class="panel" style="margin-top:32px">
      <h2 class="ph2">${esc(t('Что проверяем'))}</h2>
      <p class="mut" style="margin:0 0 16px;font-size:14px">${esc(t('Чем больше сезонов выбрано, тем точнее поиск по всей истории. Лишние вопросы почти не добавляются.'))}</p>
      <div class="hint" id="hint" hidden></div>
      ${all.length > 1 ? `<div class="seg" role="group" aria-label="scope">
        <button data-mode="all">${esc(t('Весь сюжет'))}</button><button data-mode="one">${esc(t('Только этот'))}</button><button data-mode="custom">${esc(t('Свой выбор'))}</button></div>` : ''}
      <div class="entries" id="main">${a.main.map(entryRow).join('')}</div>
      ${a.other.length ? `<details class="more" ${(saved || hintEntry) && a.other.some(e => picked.has(e.id)) ? 'open' : ''}><summary><i class="ph ph-caret-right"></i>${esc(t('Ещё из франшизы: спешлы, OVA, фильмы ({n})', { n: a.other.length }))}</summary><div class="entries">${a.other.map(entryRow).join('')}</div></details>` : ''}
      <div class="range-in"><span>${esc(t('Если примерно помнишь, сузь поиск: смотрел точно до'))}</span><input id="from" type="number" min="0" inputmode="numeric" placeholder="0" aria-label="${esc(t('Точно смотрел до серии'))}"><span>${esc(t('и точно не дальше'))}</span><input id="to" type="number" min="1" inputmode="numeric" placeholder="${esc(t('все'))}" aria-label="${esc(t('Точно не смотрел после серии'))}"><span>${esc(t('серии'))}</span></div>
      ${years.length ? `<div class="range-in"><span>${esc(t('Смотрел, пока выходило, и бросил примерно в'))}</span><select id="year" aria-label="${esc(t('Год'))}"><option value="">${esc(t('не помню'))}</option>${Array.from({ length: Math.max(0, y1 - y0 + 1) }, (_, i) => `<option>${y0 + i}</option>`).join('')}</select><span id="year-out"></span></div>` : ''}
      <div class="opts">
        ${lang !== 'en' ? `<label class="opt"><span class="switch"><input type="checkbox" id="o-tr" ${settings.translate ? 'checked' : ''}><span></span></span><span class="tx"><b>${esc(t('Переводить на русский'))}</b><span>${esc(t('Названия и описания серий есть только на английском'))}</span></span></label>` : ''}
        <label class="opt"><span class="switch"><input type="checkbox" id="o-sp" ${settings.spoilers ? 'checked' : ''}><span></span></span><span class="tx"><b>${esc(t('Прятать описания'))}</b><span>${esc(t('Чтобы не наткнуться на спойлер из серии, которую ты не видел'))}</span></span></label>
      </div>
    </section>

    <section class="panel" style="margin-top:20px">
      <h2 class="ph2">${esc(t('Как вспоминаем'))}</h2>
      <div class="seg methods" role="group" aria-label="method">${Object.entries(METHODS).map(([k, m]) => `<button data-m="${k}"><i class="ph ${m.icon}"></i>${esc(t(m.name))}</button>`).join('')}</div>
      <p class="mut mdesc" id="mdesc"></p>
      <div id="mbody"></div>
    </section>
    <div class="startbar" id="startbar">
      <button class="btn primary" id="start"><i class="ph ph-play"></i><span id="start-t"></span></button>
      <span class="mut" id="summary" style="font-size:14px"></span>
    </div>
  </div>`;

  if ($('#more')) $('#more').onclick = e => { $('#desc').classList.toggle('clamp'); e.target.textContent = $('#desc').classList.contains('clamp') ? t('Читать полностью') : t('Свернуть'); };
  // descriptions come in one language per source: translate the other way when needed
  if (desc && settings.translate && ((lang === 'ru' && !a.descRu) || (lang === 'en' && !a.descEn))) translate(desc, lang).then(x => { if ($('#desc')) $('#desc').textContent = x; });
  const selected = () => all.filter(e => picked.has(e.id)).sort(byDate).map(({ id, title, ru, en, name, english, kind, count, year, poster, status, date, duration, next }) => ({ id, title, ru, en, name, english, kind, count, year, poster, status, date, duration, next }));
  const range = () => {
    const tot = totalOf(selected());
    const from = Math.max(0, Math.min(tot, +$('#from').value || 0));
    const to = Math.max(from + 1, Math.min(tot, +$('#to').value || tot));
    return { lo: from - 1, hi: to, tot };
  };
  function startQuiz(r, via) {
    const entries = selected(), total = totalOf(entries);
    session = { id, title: a.title, ru: a.ru, en: a.en, name: a.name, poster: a.poster, url: a.url, entries, total, s: { lo: Math.max(-1, r.lo), hi: Math.min(total, r.hi), k: 0 }, hist: [], asked: 0, mode: settings.quizMode === 'grid' ? 'grid' : 'frames', via };
    if (isDone(session.s)) session.result = { lo: session.s.lo, hi: session.s.hi };
    saveSession();
    go(`#/a/${id}/${session.result ? 'result' : 'quiz'}`);
  }

  const boxes = () => $$('.entry input');
  const sync = () => {
    $$('.seg[aria-label="scope"] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
    boxes().forEach(b => b.checked = picked.has(+b.value));
    const sel = selected(), tot = totalOf(sel);
    const { lo, hi } = range(), span = Math.max(1, hi - lo - 1);
    $('#start').disabled = !tot || lo + 1 >= hi;
    $('#start-t').textContent = session?.id === id ? t('Начать заново') : t('Начать');
    const quiz = method === 'frames' || method === 'grid';
    const n = method === 'grid' ? Math.max(1, Math.ceil(Math.log(span + 1) / Math.log(GRID_K + 1))) : Math.ceil(Math.log2(span + 1));
    $('#summary').textContent = !all.length ? t('Серий пока не вышло') : !tot ? t('Выбери хотя бы одну часть')
      : t('{eps} в {n} {parts}', { eps: epsWord(tot), n: sel.length, parts: pw(sel.length, 'part') }) + (quiz ? ', ' + t('примерно {what}', { what: method === 'grid' ? stepWord(n) : qWord(n) }) : '');
    if (hintEp) {
      const pos = hintPos(sel, hintSeason, hintEp, hintEntry);
      $('#hint').hidden = !pos;
      if (pos) $('#hint').innerHTML = `<i class="ph ph-link"></i><span>${esc(t('{src}: {what}. Это {ep}, поэтому поиск начнётся после неё. Если смотрел меньше, поправь число ниже.', { src: hintSrc, what: (hintSeason ? t('{s}-й сезон, ', { s: hintSeason }) : '') + t('серия {n}', { n: hintEp }), ep: label(sel, pos - 1) }))}</span>`;
    }
  };
  const refreshMethod = () => { if (method === 'describe' || method === 'themes') renderMethod(); };
  $$('.seg[aria-label="scope"] button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    if (mode === 'all') picked = new Set(a.main.map(e => e.id));
    if (mode === 'one') picked = new Set([id]);
    sync(); refreshMethod();
  });
  boxes().forEach(b => b.onchange = () => { b.checked ? picked.add(+b.value) : picked.delete(+b.value); mode = 'custom'; sync(); refreshMethod(); });
  $('#from').oninput = $('#to').oninput = sync;
  if ($('#year')) $('#year').onchange = e => {
    const y = +e.target.value;
    if (!y) { $('#year-out').textContent = ''; $('#to').value = ''; return sync(); }
    const n = airedBy(selected(), y), tot = totalOf(selected());
    $('#to').value = n < tot ? Math.max(1, n) : '';
    $('#year-out').textContent = n < tot ? t('≈ к тому времени вышло {eps}', { eps: epsWord(n) }) : t('к тому времени вышло всё');
    sync();
  };
  if ($('#o-tr')) $('#o-tr').onchange = e => { settings.translate = e.target.checked; saveSettings(); };
  $('#o-sp').onchange = e => { settings.spoilers = e.target.checked; saveSettings(); };
  if (hintEp) { const pos = hintPos(selected(), hintSeason, hintEp, hintEntry); if (pos > 1) $('#from').value = pos - 1; }
  if (session?.id === id) $('#startbar').insertAdjacentHTML('afterbegin', `<a class="btn" href="#/a/${id}/quiz"><i class="ph ph-arrow-counter-clockwise"></i>${esc(t('Продолжить'))}</a>`);

  function renderMethod() {
    $$('.methods button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === method));
    $('#mdesc').textContent = t(METHODS[method].desc);
    const quiz = method === 'frames' || method === 'grid';
    $('#start').hidden = !quiz;
    descToken++; themeToken++;
    if (quiz) $('#mbody').innerHTML = '';
    if (method === 'describe') renderDescribe();
    if (method === 'themes') renderThemes();
    sync();
  }
  $$('.methods button').forEach(b => b.onclick = () => {
    method = b.dataset.m; settings.method = method;
    if (method === 'frames' || method === 'grid') settings.quizMode = method;
    saveSettings(); renderMethod();
  });

  /* describe what you remember */
  function renderDescribe() {
    $('#mbody').innerHTML = `<label class="lbl" for="mem">${esc(t('Что последнее помнишь из сюжета?'))}</label>
      <textarea id="mem" rows="3" placeholder="${esc(t('Например: Эрен впервые превратился в титана и заткнул дыру в стене огромным камнем'))}">${esc(memDraft)}</textarea>
      <p class="mut" style="font-size:13px;margin:8px 0 0">${esc(t('Лучше всего работают имена героев, места и конкретные события. Можно писать на любом языке.'))}</p>
      <div class="mrow">
        <label class="opt slim"><span class="switch"><input type="checkbox" id="o-ai" ${settings.ai ? 'checked' : ''}><span></span></span><span class="tx"><b>${esc(t('Умный ИИ-поиск'))}</b><span>${esc(t('Понимает смысл, а не только совпадение слов. Модель около 25 МБ скачается один раз и работает прямо в браузере, бесплатно'))}</span></span></label>
        <button class="btn primary" id="find"><i class="ph ph-sparkle"></i>${esc(t('Найти серию'))}<kbd>Ctrl+Enter</kbd></button>
      </div>
      <div id="matches"></div>`;
    $('#mem').oninput = e => { memDraft = e.target.value; };
    $('#mem').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#find').click(); };
    $('#o-ai').onchange = e => { settings.ai = e.target.checked; saveSettings(); };
    $('#find').onclick = runDescribe;
  }
  async function runDescribe() {
    const text = $('#mem').value.trim();
    if (text.length < 4) { $('#mem').focus(); return toast(t('Опиши хотя бы пару слов')); }
    const entries = selected();
    if (!entries.length) return toast(t('Выбери хотя бы одну часть'));
    const my = ++descToken, box = $('#matches'), btn = $('#find');
    btn.disabled = true;
    const stage = (msg, d, n) => { if (my === descToken && box.isConnected) box.innerHTML = progressHTML(msg, d, n); };
    try {
      const found = await findByMemory(entries, text, settings.ai, stage);
      if (my !== descToken || !box.isConnected) return;
      await renderMatches(found, entries, box, my);
    } catch (e) { if (box.isConnected) box.innerHTML = `<p class="mut" style="margin-top:16px">${esc(t('Не получилось: {why}. Попробуй ещё раз.', { why: e.message || t('нет связи') }))}</p>`; }
    finally { if (btn.isConnected) btn.disabled = false; }
  }
  async function renderMatches({ matches, ai, aiError, weak }, entries, box, my) {
    if (!matches.length) { box.innerHTML = `<p class="mut" style="margin-top:16px">${esc(t('Похожих серий не нашлось. Попробуй описать по-другому: имена героев, место, главное событие.'))}</p>`; return; }
    const multi = entries.length > 1;
    const LEVEL = [t('возможно'), t('похоже'), t('очень похоже')];
    const card = async (m, i) => {
      const text = m.wiki || m.synopsis;
      const [tt, s] = await Promise.all([localize(m.title), localize(text)]);
      return `<div class="match fade-in">
        <div class="img">${m.thumb ? `<img src="${esc(m.thumb)}" alt="" loading="lazy">` : `<div class="nodata small"><i class="ph ph-image-broken"></i></div>`}</div>
        <div><div class="k">${esc(multi ? nm(m.e) + ', ' : '')}${esc(epShort(m.e, m.n))} · <b class="lv${m.level}">${esc(LEVEL[m.level])}</b></div>
          <h3>${esc(tt || t('Серия {n}', { n: m.n }))}</h3>
          ${s ? `<div class="syn ${settings.spoilers && i ? 'hidden' : ''}" data-reveal data-label="${esc(t('Описание скрыто от спойлеров. Нажми, чтобы показать'))}"><p>${esc(s)}</p></div>` : `<p class="mut" style="font-size:14px;margin:0">${esc(t('Описания этой серии нет, совпало название.'))}</p>`}
          <div class="row"><button class="btn primary sm" data-pick="${m.abs}"><i class="ph ph-check"></i>${esc(t('Это последнее, что помню'))}</button><button class="btn ghost sm" data-final="${m.abs}">${esc(t('Сразу к итогу'))}</button></div>
        </div></div>`;
    };
    const first = await Promise.all(matches.slice(0, 6).map(card));
    if (my !== descToken || !box.isConnected) return;
    box.innerHTML = `${aiError ? `<p class="mut" style="font-size:13px;margin:16px 0 0"><i class="ph ph-info"></i> ${esc(t('ИИ-модель не загрузилась, искал по словам.'))}</p>` : ''}
      ${weak ? `<div class="hint" style="margin:16px 0 0"><i class="ph ph-warning-circle"></i><span>${esc(t('Уверенных совпадений нет. Добавь подробностей: имена героев, место, кто с кем сражался. Ниже самые близкие варианты.'))}</span></div>` : ''}
      <div class="matches" id="mlist">${first.join('')}</div>
      <div class="mrow">${matches.length > 6 ? `<button class="btn ghost sm" id="more-m"><i class="ph ph-plus"></i>${esc(t('Ещё варианты'))}</button>` : '<span></span>'}</div>
      <p class="mut" style="font-size:13px;margin:12px 0 0">${esc(ai ? t('Искал по смыслу с помощью ИИ и по совпадению слов.') : t('Искал по совпадению слов.'))} ${esc(t('После выбора пара вопросов проверит, не смотрел ли ты дальше.'))}</p>`;
    const bind = () => {
      $$('[data-reveal].hidden', box).forEach(el => el.onclick = () => el.classList.remove('hidden'));
      $$('[data-pick]', box).forEach(b => b.onclick = () => { const abs = +b.dataset.pick; const r = range(); startQuiz({ lo: abs, hi: Math.max(abs + 1, r.hi) }, 'describe'); });
      $$('[data-final]', box).forEach(b => b.onclick = () => { const abs = +b.dataset.final; startQuiz({ lo: abs, hi: abs + 1 }, 'describe'); });
    };
    bind();
    if ($('#more-m')) $('#more-m').onclick = async e => {
      const btn = e.currentTarget; // currentTarget is null once the handler awaits
      btn.disabled = true;
      $('#mlist').insertAdjacentHTML('beforeend', (await Promise.all(matches.slice(6).map((m, i) => card(m, i + 6)))).join(''));
      btn.remove(); bind();
    };
  }

  /* openings and endings */
  let player = null;
  async function renderThemes() {
    const entries = selected(), my = ++themeToken, body = $('#mbody');
    if (!entries.length) { body.innerHTML = `<p class="mut">${esc(t('Выбери хотя бы одну часть.'))}</p>`; return; }
    body.innerHTML = `<div class="themes">${'<div class="theme skel" style="height:64px"></div>'.repeat(4)}</div>`;
    const list = await themesFor(entries).catch(() => []);
    if (my !== themeToken || !body.isConnected) return;
    if (!list.length) { body.innerHTML = `<p class="mut">${esc(t('Для этих частей опенингов в базе AnimeThemes нет. Попробуй кадры или описание словами.'))}</p>`; return; }
    let lastEntry = null;
    body.innerHTML = `<div class="themes">${list.map((x, i) => {
      const head = entries.length > 1 && x.e !== lastEntry ? `<div class="theme-h">${esc(nm(x.e))}</div>` : '';
      lastEntry = x.e;
      return `${head}<div class="theme" data-i="${i}">
        <button class="btn icon play" ${x.video ? '' : 'disabled'} aria-label="${esc(t('Слушать {slug}', { slug: x.slug }))}"><i class="ph ph-play"></i></button>
        <div class="tx"><div class="t"><span class="tag ${x.type === 'ED' ? 'ed' : ''}">${esc(x.slug)}</span>${esc(x.song || t('Без названия'))}</div>
          <div class="s">${esc([x.artist, x.eps ? t('серии {eps}', { eps: x.eps }) : t('серии неизвестны')].filter(Boolean).join(' · '))}</div></div>
        ${x.abs != null ? `<button class="btn sm pick">${esc(t('Последний, что помню'))}</button>` : '<span></span>'}
        <div class="vid"></div></div>`;
    }).join('')}</div><div id="tconfirm"></div>`;
    $$('.theme', body).forEach(row => {
      const x = list[+row.dataset.i];
      row.querySelector('.play').onclick = () => {
        const on = row.classList.contains('on');
        player?.row.classList.remove('on'); player?.row.querySelector('.play i').classList.replace('ph-stop', 'ph-play');
        if (player) { player.v.pause(); player.v.remove(); player = null; }
        if (on) return;
        const v = document.createElement('video');
        v.src = x.video; v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
        row.querySelector('.vid').append(v); row.classList.add('on'); row.querySelector('.play i').classList.replace('ph-play', 'ph-stop');
        player = { v, row };
      };
      const pick = row.querySelector('.pick');
      if (pick) pick.onclick = () => choose(+row.dataset.i);
    });
    function choose(i) {
      const cur = list[i], next = list.find(x => x.abs != null && x.abs > cur.abs);
      $$('.theme', body).forEach(r => r.classList.toggle('picked', +r.dataset.i === i));
      const start = hi => { const r = range(); startQuiz({ lo: Math.max(r.lo, cur.abs - 1), hi: Math.min(r.hi, Math.max(cur.abs + 1, hi)) }, 'themes'); };
      const box = $('#tconfirm');
      box.innerHTML = `<div class="tconfirm fade-in">
        <p>${t('<b>Последний, что помнишь:</b> {slug} «{song}», {ep}.', { slug: esc(cur.slug), song: esc(cur.song), ep: esc(label(entries, cur.abs)) })}</p>
        ${next ? `<p>${esc(t('Следующая песня по порядку: {slug} «{song}», начинается с {ep}. Её ты уже не слышал?', { slug: next.slug, song: next.song, ep: label(entries, next.abs) }))}</p>
          <div class="row"><button class="btn primary sm" data-c="no">${esc(t('Не слышал'))}</button><button class="btn sm" data-c="yes">${esc(t('Слышал, она последняя'))}</button><button class="btn ghost sm" data-c="unsure">${esc(t('Не уверен, мог пропускать'))}</button></div>`
        : `<div class="row"><button class="btn primary sm" data-c="unsure">${esc(t('Дальше: уточнить по кадрам'))}</button></div>`}</div>`;
      box.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
      $$('[data-c]', box).forEach(b => b.onclick = () => {
        if (b.dataset.c === 'yes') return choose(list.indexOf(next));
        start(b.dataset.c === 'no' ? next.abs : range().hi);
      });
    }
  }

  $('#start').onclick = () => startQuiz(range(), method);
  renderMethod();
  cleanup = () => { player?.v.pause(); descToken++; themeToken++; };
}

/* ---------- views: quiz ---------- */
function viewQuiz(id) {
  if (!session || session.id !== id) return go('#/a/' + id);
  document.title = t('Вспоминаем: {title}', { title: nm(session) });
  if (isDone(session.s)) return finish();
  session.mode ||= 'frames';
  let dir = 'r', token = 0;

  app.innerHTML = `<div class="wrap quiz">
    <div class="qbar">
      <a class="btn ghost icon" href="#/a/${id}" aria-label="${esc(t('К тайтлу'))}"><i class="ph ph-arrow-left"></i></a>
      <span class="grow" id="qtitle"></span>
      <button class="btn ghost icon" id="t-mode"><i class="ph"></i></button>
      ${lang !== 'en' ? `<button class="btn ghost icon" id="t-tr" aria-label="${esc(t('Перевод'))}"><i class="ph ph-translate"></i></button>` : ''}
      <button class="btn ghost icon" id="t-sp" aria-label="${esc(t('Скрытие описаний'))}"><i class="ph"></i></button>
    </div>
    <div class="timeline" aria-hidden="true"><div class="segs">${session.entries.map(e => `<div style="flex:${e.count}" title="${esc(nm(e))}"></div>`).join('')}</div><div class="known"></div><div class="win"></div><div class="mark"></div><div class="ticks"></div></div>
    <div id="stage"></div>
  </div>`;
  const setToggles = () => {
    if ($('#t-tr')) { $('#t-tr').style.color = settings.translate ? 'var(--acc)' : ''; $('#t-tr').setAttribute('aria-pressed', settings.translate); }
    $('#t-sp i').className = 'ph ' + (settings.spoilers ? 'ph-eye-slash' : 'ph-eye');
    $('#t-sp').setAttribute('aria-pressed', settings.spoilers);
    $('#t-mode i').className = 'ph ' + (session.mode === 'grid' ? 'ph-cards' : 'ph-squares-four');
    $('#t-mode').setAttribute('aria-label', session.mode === 'grid' ? t('Перейти к одному кадру') : t('Перейти к сетке кадров'));
    $('#t-mode').title = $('#t-mode').getAttribute('aria-label');
  };
  setToggles();
  if ($('#t-tr')) $('#t-tr').onclick = () => { settings.translate = !settings.translate; saveSettings(); setToggles(); render(true); toast(settings.translate ? t('Перевод включён') : t('Перевод выключен')); };
  $('#t-sp').onclick = () => { settings.spoilers = !settings.spoilers; saveSettings(); setToggles(); render(true); toast(settings.spoilers ? t('Описания скрыты') : t('Описания видны')); };
  $('#t-mode').onclick = () => { session.mode = session.mode === 'grid' ? 'frames' : 'grid'; settings.quizMode = session.mode; saveSettings(); saveSession(); setToggles(); render(); toast(session.mode === 'grid' ? t('Сетка кадров') : t('По одному кадру')); };

  function timeline(s, p, ticks = []) {
    const T = session.total;
    $('.known').style.width = `${((s.lo + 1) / T) * 100}%`;
    $('.win').style.left = `${((s.lo + 1) / T) * 100}%`;
    $('.win').style.width = `max(6px, ${((s.hi - s.lo - 1) / T) * 100}%)`;
    $('.mark').style.display = p == null ? 'none' : '';
    if (p != null) $('.mark').style.left = `${((p + .5) / T) * 100}%`;
    $('.ticks').innerHTML = ticks.map(x => `<i style="left:${((x + .5) / T) * 100}%"></i>`).join('');
  }
  function prefetch(s) {
    for (const v of ['yes', 'no']) {
      const n = answer(s, v); if (isDone(n)) continue;
      const p = locate(session.entries, probe(n));
      episode(p.e, p.n).then(ep => { preload(ep.thumb); localize(ep.title); localize(ep.synopsis); }).catch(() => {});
    }
  }
  const render = keepAnim => session.mode === 'grid' ? renderGrid(keepAnim) : renderOne(keepAnim);
  const anim = keepAnim => keepAnim ? '' : 'slide-in' + (dir === 'l' ? ' from-l' : '');
  const noData = () => `<div class="nodata"><i class="ph ph-image-broken"></i>${esc(t('Кадра из этой серии нет'))}</div>`;

  async function renderOne(keepAnim) {
    const s = session.s, p = probe(s), my = ++token;
    const T = session.total;
    timeline(s, p);
    $('#qtitle').innerHTML = `${esc(nm(session))} <span class="mono" style="margin-left:6px">${esc(t('вопрос {n}, осталось ~{left}', { n: session.asked + 1, left: questionsLeft(s) }))}</span>`;
    const loc = locate(session.entries, p);
    const multi = session.entries.length > 1;
    const stage = $('#stage');
    stage.innerHTML = `<div class="qgrid ${anim(keepAnim)}">
      <div class="shot" id="shot"><div class="skel" style="position:absolute;inset:0"></div><span class="stamp y">${esc(t('Помню'))}</span><span class="stamp n">${esc(t('Не помню'))}</span></div>
      <div class="qinfo">
        <div class="where">${multi ? `${esc(nm(loc.e))} · ` : ''}<b>${esc(loc.e.kind === 'movie' ? t('Фильм') : t('Серия {n}', { n: loc.n }))}</b>${multi ? ` <span class="mono">(${esc(t('{d} из {n}', { d: p + 1, n: T }))})</span>` : ` <span class="mono">${esc(t('из {n}', { n: loc.e.count }))}</span>`}</div>
        <div id="info"><div class="skel skel-line" style="width:80%;height:26px"></div><div class="skel skel-line" style="width:40%"></div><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line" style="width:70%"></div></div>
        <div class="answers">
          <button class="btn primary" data-v="yes"><i class="ph ph-check"></i>${esc(t('Помню'))}<kbd>→</kbd></button>
          <button class="btn" data-v="no"><i class="ph ph-x"></i>${esc(t('Не помню'))}<kbd>←</kbd></button>
          <button class="btn ghost wide" data-v="unsure"><i class="ph ph-question"></i>${esc(t('Не уверен, покажи соседнюю'))}<kbd>↓</kbd></button>
        </div>
        <div class="answers-sub"><button class="btn ghost sm" id="back" ${session.hist.length ? '' : 'disabled'}><i class="ph ph-arrow-u-up-left"></i>${esc(t('Назад'))}<kbd>Bksp</kbd></button>
        <button class="btn ghost sm" id="stop"><i class="ph ph-flag-checkered"></i>${esc(t('Хватит, покажи итог'))}</button></div>
      </div></div>`;
    $$('[data-v]', stage).forEach(b => b.onclick = () => act(b.dataset.v));
    $('#back').onclick = undo;
    $('#stop').onclick = () => finish();
    bindSwipe($('#shot'));
    prefetch(s);

    const ep = await episode(loc.e, loc.n).catch(() => null);
    if (my !== token) return;
    const shot = $('#shot');
    const pic = ep?.thumb || (loc.e.kind === 'movie' ? loc.e.poster : '');
    if (pic) {
      const im = new Image(); im.alt = ep?.title || ''; im.decoding = 'async'; im.draggable = false;
      if (!ep?.thumb) im.className = 'contain';
      im.onload = () => { if (my === token) shot.querySelector('.skel')?.remove(); };
      im.onerror = () => { if (my === token) shot.innerHTML = noData(); };
      im.src = pic; shot.prepend(im);
    } else { shot.querySelector('.skel').outerHTML = noData(); }

    const origTitle = ep?.title || '', origSyn = ep?.synopsis || '';
    const [title, syn] = await Promise.all([localize(origTitle), localize(origSyn)]);
    if (my !== token) return;
    const showAlt = origTitle && title !== origTitle ? origTitle : (ep?.alt || '');
    $('#info').innerHTML = `<h2>${esc(title || (loc.e.kind === 'movie' ? nm(loc.e) : t('Серия {n}', { n: loc.n })))}</h2>
      ${showAlt ? `<p class="alt">${esc(showAlt)}</p>` : '<div style="height:12px"></div>'}
      ${syn ? `<div class="syn ${settings.spoilers ? 'hidden' : ''}" id="syn" data-label="${esc(t('Описание скрыто от спойлеров. Нажми, чтобы показать'))}" ${settings.spoilers ? 'role="button" tabindex="0"' : ''}><p>${esc(syn).replace(/\n+/g, '<br><br>')}</p></div>
      ${origSyn !== syn ? `<div class="syn-tools"><button class="linkbtn" id="orig">${esc(t('Показать оригинал'))}</button></div>` : ''}`
      : `<p class="mut" style="font-size:15px;margin:0">${esc(t('Описания этой серии нет. Ориентируйся на кадр или нажми «Не уверен».'))}</p>`}
      ${ep?.airdate ? `<p class="mut mono" style="font-size:13px;margin:14px 0 0">${esc(t('Вышла {date}', { date: fmtDate(ep.airdate) }))}</p>` : ''}`;
    const sy = $('#syn');
    if (sy && settings.spoilers) { const open = () => { sy.classList.remove('hidden'); sy.removeAttribute('role'); }; sy.onclick = open; sy.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }; }
    if ($('#orig')) $('#orig').onclick = e => { const showO = !e.target.dataset.o; $('#syn p').innerHTML = esc(showO ? origSyn : syn).replace(/\n+/g, '<br><br>'); e.target.dataset.o = showO ? '1' : ''; e.target.textContent = showO ? t('Показать перевод') : t('Показать оригинал'); };
  }

  function renderGrid(keepAnim) {
    const s = session.s, my = ++token, ps = gridProbes(s), multi = session.entries.length > 1;
    timeline(s, null, ps);
    $('#qtitle').innerHTML = `${esc(nm(session))} <span class="mono" style="margin-left:6px">${esc(t('шаг {n}, осталось ~{left}', { n: session.asked + 1, left: gridLeft(s) }))}</span>`;
    $('#stage').innerHTML = `<div class="${anim(keepAnim)}">
      <p class="gq-hint">${t('Выбери <b>самый поздний</b> кадр, который помнишь')}</p>
      <div class="gq">${ps.map((p, j) => { const l = locate(session.entries, p); return `<button class="gcell" data-j="${j}"><div class="gshot skel"></div><div class="gmeta"><kbd class="gk">${j + 1}</kbd>${esc(multi ? nm(l.e) + ', ' : '')}${esc(epShort(l.e, l.n))}</div><div class="gt" data-t></div></button>`; }).join('')}</div>
      <div class="gq-actions">
        <button class="btn" id="none"><i class="ph ph-x"></i>${esc(t('Не помню ни один'))}<kbd>0</kbd></button>
        <button class="btn ghost sm" id="back" ${session.hist.length ? '' : 'disabled'}><i class="ph ph-arrow-u-up-left"></i>${esc(t('Назад'))}<kbd>Bksp</kbd></button>
        <button class="btn ghost sm" id="stop"><i class="ph ph-flag-checkered"></i>${esc(t('Хватит, покажи итог'))}</button>
      </div></div>`;
    $$('.gcell').forEach(b => b.onclick = () => pickGrid(+b.dataset.j));
    $('#none').onclick = () => pickGrid(-1);
    $('#back').onclick = undo;
    $('#stop').onclick = () => finish();
    ps.forEach(async (p, j) => {
      const l = locate(session.entries, p);
      const ep = await episode(l.e, l.n).catch(() => null);
      if (my !== token) return;
      const cell = $$('.gcell')[j]; if (!cell) return;
      const pic = ep?.thumb || (l.e.kind === 'movie' ? l.e.poster : '');
      const box = cell.querySelector('.gshot');
      box.classList.remove('skel');
      box.innerHTML = pic ? `<img src="${esc(pic)}" alt="" decoding="async" draggable="false" ${ep?.thumb ? '' : 'class="contain"'}>` : '<div class="nodata small"><i class="ph ph-image-broken"></i></div>';
      const x = await localize(ep?.title || '');
      if (my === token) cell.querySelector('[data-t]').textContent = x;
    });
  }

  function act(v) {
    session.hist.push(session.s);
    session.s = answer(session.s, v);
    if (v !== 'unsure') session.asked++;
    saveSession();
    dir = v === 'no' ? 'l' : 'r';
    if (isDone(session.s)) return finish();
    render();
  }
  function pickGrid(j) {
    const ps = gridProbes(session.s);
    if (j >= ps.length) return;
    session.hist.push(session.s);
    session.s = gridPick(session.s, j);
    session.asked++; saveSession();
    dir = j < 0 ? 'l' : 'r';
    if (isDone(session.s)) return finish();
    render();
  }
  function undo() {
    if (!session.hist.length) return;
    session.s = session.hist.pop();
    session.asked = Math.max(0, session.asked - 1);
    saveSession(); dir = 'l'; render();
  }
  function finish() {
    const s = session.s;
    session.result = { lo: s.lo, hi: s.hi };
    saveSession();
    go(`#/a/${id}/result`);
  }
  function bindSwipe(el) {
    let x0 = null, dx = 0;
    el.onpointerdown = e => { if (e.pointerType === 'mouse') return; x0 = e.clientX; dx = 0; el.style.transition = 'none'; el.setPointerCapture(e.pointerId); };
    el.onpointermove = e => {
      if (x0 == null) return; dx = e.clientX - x0;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
      el.querySelector('.stamp.y').style.opacity = Math.max(0, Math.min(1, dx / 90));
      el.querySelector('.stamp.n').style.opacity = Math.max(0, Math.min(1, -dx / 90));
    };
    el.onpointerup = el.onpointercancel = () => {
      if (x0 == null) return; x0 = null;
      el.style.transition = 'transform .3s var(--ease)';
      el.style.transform = '';
      $$('.stamp', el).forEach(x => x.style.opacity = 0);
      if (Math.abs(dx) > 90) act(dx > 0 ? 'yes' : 'no');
    };
  }
  const onKey = e => {
    if (e.target.closest?.('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'Backspace') { e.preventDefault(); return undo(); }
    if (session.mode === 'grid') {
      if (/^[1-9]$/.test(k)) { e.preventDefault(); pickGrid(+k - 1); }
      else if (k === '0' || k === 'ArrowLeft') { e.preventDefault(); pickGrid(-1); }
      return;
    }
    if (k === 'ArrowRight') { e.preventDefault(); act('yes'); }
    else if (k === 'ArrowLeft') { e.preventDefault(); act('no'); }
    else if (k === 'ArrowDown') { e.preventDefault(); act('unsure'); }
    else if (k === ' ' && $('#syn.hidden')) { e.preventDefault(); $('#syn').click(); }
  };
  addEventListener('keydown', onKey);
  cleanup = () => { removeEventListener('keydown', onKey); token++; };
  render();
}

/* ---------- views: result ---------- */
async function viewResult(id) {
  if (!session || session.id !== id || !session.result) {
    const it = lib().find(x => x.id === id);
    return it ? go('#/a/' + id) : go('#/');
  }
  const S = session, { lo, hi } = S.result, T = S.total, E = S.entries;
  const exact = hi - lo <= 1;
  const nextAbs = lo + 1;
  document.title = t('Итог: {title}', { title: nm(S) });
  upsertLib(libItem({ id, title: S.title, ru: S.ru, en: S.en, poster: S.poster, url: S.url, entries: E, pos: lo }));

  let h1, sub;
  if (lo < 0 && exact) { h1 = t('Начни с <b>первой серии</b>'); sub = t('Похоже, ты не помнишь даже начало. Так даже лучше: посмотришь всё заново.'); }
  else if (nextAbs >= T) { h1 = t('Ты всё <b>досмотрел</b>'); sub = E.some(e => e.status === 'ongoing') ? t('Новых серий пока нет. Загляни позже: онгоинг продолжается.') : t('Похоже, история пройдена до конца.'); }
  else if (exact) {
    const a = locate(E, lo), b = locate(E, nextAbs);
    h1 = a.e.kind === 'movie' ? t('Ты остановился на <b>фильме</b>') : t('Ты остановился на <b>{n}-й серии</b>', { n: a.n });
    const nxt = b.e.id === a.e.id ? t('серия {n}', { n: b.n }) : b.e.kind === 'movie' ? t('фильм «{title}»', { title: nm(b.e) }) : `${nm(b.e)}, ${t('серия {n}', { n: b.n })}`;
    sub = (E.length > 1 ? `${nm(a.e)}. ` : '') + t('Дальше: {what}.', { what: nxt });
  }
  else {
    const b = locate(E, nextAbs);
    h1 = b.e.kind === 'movie' ? t('Продолжай с <b>фильма</b>') : t('Продолжай с <b>{n}-й серии</b>', { n: b.n });
    // hi === T means the upper bound was never checked (stopped early after a "yes")
    const why = hi >= T ? t('Точнее определить не вышло: ты помнишь {a}, а дальше мы не проверяли.', { a: acc(E, lo) })
      : lo < 0 ? t('Точнее определить не вышло: ты не помнишь {b}.', { b: acc(E, hi) })
      : t('Точнее определить не вышло: ты помнишь {a}, но не помнишь {b}.', { a: acc(E, lo), b: acc(E, hi) });
    sub = (E.length > 1 ? `${nm(b.e)}. ` : '') + why + ' ' + t('Начни отсюда, в худшем случае пересмотришь пару знакомых серий.');
  }
  if (nextAbs < T) sub += ' ' + t('Осталось {eps}, это примерно {time}.', { eps: epsWord(T - nextAbs), time: fmtDur(minutesLeft(E, lo)) });
  const via = { describe: t('по описанию'), themes: t('по опенингам') }[S.via];
  const steps = S.asked ? (S.mode === 'grid' ? stepWord(S.asked) : qWord(S.asked)) : '';
  const how = [via, steps].filter(Boolean).join(t(' и '));

  const epCard = (abs, kind) => {
    const p = locate(E, abs); if (!p) return '';
    return `<article class="epcard ${kind}" data-abs="${abs}"><div class="img skel"></div><div class="body">
      <div class="k">${esc(kind === 'next' ? t('Смотреть дальше') : t('Последняя, которую помнишь'))} · ${esc(E.length > 1 ? `${nm(p.e)}, ` : '')}${esc(epShort(p.e, p.n))}</div>
      <h3 class="ttl"><span class="skel skel-line" style="display:block;width:70%"></span></h3></div></article>`;
  };
  const watchQ = nextAbs < T ? (() => { const p = locate(E, nextAbs); return `${nm(p.e)} ${p.e.kind === 'movie' ? '' : t('{n} серия', { n: p.n })} ${t('смотреть')}`; })() : `${nm(S)} ${t('смотреть')}`;

  app.innerHTML = `<div class="backdrop">${S.poster ? `<img src="${esc(S.poster)}" alt="">` : ''}</div>
  <div class="wrap result fade-in">
    <p class="lead">${esc([nm(S), how].filter(Boolean).join(' · '))}</p>
    <h1>${h1}</h1>
    <p class="sub">${esc(sub)}</p>
    <div class="pair">${lo >= 0 ? epCard(lo, 'last') : ''}${nextAbs < T ? epCard(nextAbs, 'next') : ''}</div>
    <div class="actions">
      ${lo >= 0 ? `<button class="btn primary" id="recap-b"><i class="ph ph-clock-counter-clockwise"></i>${esc(t('Напомнить, что было'))}</button>` : ''}
      <a class="btn" href="https://www.google.com/search?q=${encodeURIComponent(watchQ)}" target="_blank" rel="noopener"><i class="ph ph-play-circle"></i>${esc(t('Где смотреть'))}</a>
      <button class="btn" id="copy"><i class="ph ph-copy"></i>${esc(t('Скопировать'))}</button>
      ${S.url ? `<a class="btn ghost" href="${esc(S.url)}" target="_blank" rel="noopener"><i class="ph ph-arrow-square-out"></i>Shikimori</a>` : ''}
      <button class="btn ghost" id="again"><i class="ph ph-arrow-counter-clockwise"></i>${esc(t('Пройти заново'))}</button>
    </div>
    <div id="recap"></div>
    <p class="mut" style="font-size:14px;margin-top:32px"><i class="ph ph-bookmark-simple" style="color:var(--acc)"></i> ${t('Сохранено в <a href="#/library">Мои тайтлы</a>. Отмечай там просмотренные серии, и больше не придётся вспоминать.')}</p>
  </div>`;

  $$('.epcard').forEach(async card => {
    const abs = +card.dataset.abs, p = locate(E, abs);
    const ep = await episode(p.e, p.n).catch(() => null);
    const pic = ep?.thumb || p.e.poster;
    card.querySelector('.img').outerHTML = `<div class="img">${pic ? `<img src="${esc(pic)}" alt="" style="${ep?.thumb ? '' : 'object-fit:contain;background:#0b0c0e'}">` : ''}</div>`;
    card.querySelector('.ttl').textContent = ep?.title ? await localize(ep.title) : (p.e.kind === 'movie' ? nm(p.e) : t('Серия {n}', { n: p.n }));
  });

  $('#copy').onclick = async () => {
    const txt = exact && lo >= 0 ? t('{title}: остановился на {ep}.', { title: nm(S), ep: label(E, lo) }) + (nextAbs < T ? ' ' + t('Дальше: {what}.', { what: label(E, nextAbs) }) : '') : t('{title}: продолжать с {ep}.', { title: nm(S), ep: label(E, Math.min(nextAbs, T - 1)) });
    try { await navigator.clipboard.writeText(txt); toast(t('Скопировано')); } catch { toast(txt); }
  };
  $('#again').onclick = () => { session = null; saveSession(); go('#/a/' + id); };
  if ($('#recap-b')) $('#recap-b').onclick = async e => {
    e.currentTarget.disabled = true;
    const box = $('#recap');
    const idx = [lo - 2, lo - 1, lo].filter(i => i >= 0);
    box.innerHTML = `<div class="recap"><h2>${esc(t('Что было в последних сериях'))}</h2>${idx.map(() => `<div class="recap-item"><div class="img skel"></div><div><div class="skel skel-line" style="width:50%"></div><div class="skel skel-line"></div><div class="skel skel-line"></div></div></div>`).join('')}</div>`;
    box.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    const items = await Promise.all(idx.map(async i => {
      const p = locate(E, i);
      const [ep, wk] = await Promise.all([episode(p.e, p.n).catch(() => null), wikiForEntry(p.e, E[0]).catch(() => [])]);
      // the recap wants the detailed Wikipedia summary when there is one
      const [tt, s] = await Promise.all([localize(ep?.title || ''), localize(wk[p.n - 1]?.sum || ep?.synopsis || '')]);
      return { p, ep, tt, s };
    }));
    box.innerHTML = `<div class="recap fade-in"><h2>${esc(t('Что было в последних сериях'))}</h2>${items.map(({ p, ep, tt, s }) => `<div class="recap-item">
      <div class="img">${ep?.thumb ? `<img src="${esc(ep.thumb)}" alt="" loading="lazy">` : ''}</div>
      <div><div class="mut" style="font-size:13px">${esc(E.length > 1 ? nm(p.e) + ', ' : '')}${esc(epShort(p.e, p.n))}</div><h3>${esc(tt || t('Без названия'))}</h3><p>${esc(s || t('Описания нет.'))}</p></div></div>`).join('')}</div>`;
  };
}

paintChrome();
route();

// Installable app: only when served over https (GitHub Pages), not from disk
